name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository checks
        run: python3 scripts/check.py
      - name: Generated files are current
        run: python3 scripts/build.py --check
      - name: Test checker self-test
        run: cd evals/harness && python3 selftest.py
      - name: Test bank hashes unchanged
        run: cd evals/testbank && sha256sum -c HASHES.sha256
