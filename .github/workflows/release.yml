name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check.py && python3 scripts/build.py --check
      - name: Publish Skill zips as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" docs/downloads/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" docs/downloads/*.zip --title "$GITHUB_REF_NAME" \
              --notes "Skill zips for upload in Claude (Settings > Capabilities > Skills). Phone pages: https://jfk-cil.github.io/small-business-ai-helpers/"
          fi
